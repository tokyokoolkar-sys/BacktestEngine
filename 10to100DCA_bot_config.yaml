# Bot Configuration: $10 to $100 Micro-Capital Strategy
# Objective: Maximize asymmetric upside using $10 capital while satisfying Binance's 5 USDT minimum notional value constraints.

api:
  key: ${BINANCE_API_KEY}
  secret: ${BINANCE_API_SECRET}

global:
  ntfy_topic: "kool-bot-7x4q9"
  leverage: 10
  base_margin: 1.0       # $1 margin * 10x leverage = $10 notional (satisfies the $5 min limit)
  dca_margin: 1.0        # $1 margin for each safety order
  max_dca_orders: 9      # 1 Base Order + 9 Safety Orders = $10 Total Capital Max
  max_concurrent_baskets: 1 # Strictly 1 pair at a time to prevent exceeding $10 capital
  daily_loss_limit: 9.50 # Safety switch to halt trading if the $10 is nearly wiped out
  trail_activate_pct: 1.0
  trail_buffer_pct: 0.45
  step_multiplier: 1.0
  size_multiplier: 1.0
  first_order_ratio: 0.96
  fee_taker: 0.0005
  fee_maker: 0.0002

symbols:
  - name: CAPUSDT
    active: true
    direction: long
    tp_pct: 1.2
    stop_pct: 9999 
    max_dca_orders: 9
    drop_step_pct: 0.6
  
  - name: AIAUSDT
    active: true 
    direction: long
    tp_pct: 1.5
    stop_pct: 9999
    max_dca_orders: 9
    drop_step_pct: 0.75