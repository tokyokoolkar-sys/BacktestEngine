# high_roi_bot_config — long-only DCA scalp, volume-spike-only entry, 10-symbol universe
# No EMA / red-candle gate (per spec). All filters run on 1h bars.
# stop_pct tiers corrected: original ask (8.0/8.5/10.0) exceeded the 7.5% liq distance
# at 8x leverage (100*(1/8-0.05)) — stop would never fire, liq fires first. Shrunk to
# 5.0/5.5/6.5 to stay safely under 7.5% with buffer for slippage/fees.
