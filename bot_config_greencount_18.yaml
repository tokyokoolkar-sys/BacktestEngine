api:
  key: ${BINANCE_API_KEY}
  secret: ${BINANCE_API_SECRET}
symbols:
  - {name: INJUSDT, tp_pct: 0.8, stop_pct: 2.0, max_dca_orders: 2, active: true}
  - {name: NEARUSDT, tp_pct: 0.8, stop_pct: 2.0, max_dca_orders: 2, active: true}
  - {name: TIAUSDT, tp_pct: 0.5, stop_pct: 2.0, max_dca_orders: 2, active: true}
  - {name: OPUSDT, tp_pct: 0.5, stop_pct: 2.0, max_dca_orders: 2, active: true}
  - {name: APTUSDT, tp_pct: 0.5, stop_pct: 2.0, max_dca_orders: 2, active: true}
  - {name: FILUSDT, tp_pct: 0.5, stop_pct: 2.0, max_dca_orders: 2, active: true}
  - {name: ARBUSDT, tp_pct: 0.5, stop_pct: 2.0, max_dca_orders: 2, active: true}
global:
  leverage: 8
  base_margin: 2.0
  dca_margin: 2.0
  max_dca_orders: 2
  drop_step_pct: 0.8
  step_multiplier: 1.0
  size_multiplier: 1.0
  first_order_ratio: 0.96
  max_concurrent_baskets: 1
  daily_loss_limit: 1.25
  fee_taker: 0.0005
  fee_maker: 0.0002
  poll_interval_sec: 60
  risk_per_trade_pct: 0.0
  trail_activate_pct: 0.0
  greencount_filter: true
  greencount_period: 10
  greencount_auto_side: true
  dual_mode: false
