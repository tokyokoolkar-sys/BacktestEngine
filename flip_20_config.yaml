# flip_20_config.yaml — v3: $87 weekly-compound fleet (was: $20->$100 sprint)
#
# Basis: 60 days OOS-style data (May+June 2026, May fully unseen by any tuning),
# 10 candidate symbols backtested dual-direction with greencount N=10 auto-side;
# all 10 positive over 2 months. Fleet = top 6 by 2-month net with low liq count.
# Sweep of {fleet size} x {risk frac} x {K} + ATR-ladder A/B, 300-path MC:
#
#   6 symbols, ATR ladder 0.75x, frac=0.30, K=3 (chosen — dominates fixed):
#     as-is edge:    median $4,425 from $87 in 60d,  p95 maxDD 40%
#     edge-halved:   median $553 (~6.4x in 2mo),     p95 maxDD 50%
#     vs the fixed-0.3%-ladder baseline at 0.20/K=4 ($3,221 / $477 / 39% / 49%):
#     more growth in BOTH scenarios at the same drawdown tail. The ATR ladder's
#     liq cut (May: 21 -> 5) is what buys the extra sizing headroom.
#
#   Rejected: fixed-ladder 0.25+/K3-4 (DD tail grows faster than growth);
#   10-symbol fleet (bottom ranks noisy: p95 DD 72% halved-edge);
#   non-DCA families tested head-to-head on same data/fees — ALL negative
#   (donchian -15, ema-cross -7, rsi-meanrev -5, single-shot greencount -30):
#   the fee-adjusted edge lives in the ladder absorbing noise, not the signal.
#
# Sizing chain: bot divides risk budget by ladder total-ratio (~4.18 at DCA=3);
# risk_per_trade_pct is the FULL-BASKET margin fraction. 0.20 * K=4 = max 80%
# equity deployed. Base-rung notional stays over $5 minNotional down to ~$10.50.
#
# HARD RULES:
#   1. Leverage 10, never higher — at 20x liq lands inside the 0.3% ladder
#      (100% of backtested trades liquidated at 20x).
#   2. daily_loss_limit stays on. Hit = day over, no override.
#   3. Compounding is automatic (risk % of live balance). No manual size boosts
#      after a green week — the % IS the compounding.
#   4. Re-evaluate the fleet monthly: re-run the 10-symbol ranking on the fresh
#      month; swap out any symbol that went negative both directions.

api:
  key: ${BINANCE_API_KEY}
  secret: ${BINANCE_API_SECRET}

# stop_pct 5.0: bot ALWAYS places a STOP_MARKET (0.0 would stop at entry).
# 5% at 10x = -50% of basket margin ~= the ladder's worst liquidation, but fires
# before actual liquidation. Ladder bottom is -0.9%; stop only fires on disaster.
symbols:
  - name: NEARUSDT      # 2mo net +5.35 (best) | May+Jun liqs 8
    tp_pct: 0.8
    stop_pct: 5.0
    active: true
    direction: long     # auto_side overrides while flat

  - name: TIAUSDT       # 2mo net +3.77 | liqs 4
    tp_pct: 0.5
    stop_pct: 5.0
    active: true
    direction: long

  - name: OPUSDT        # 2mo net +3.51 | liqs 4
    tp_pct: 0.5
    stop_pct: 5.0
    active: true
    direction: long

  - name: FILUSDT       # 2mo net +3.21 | liqs 4
    tp_pct: 0.5
    stop_pct: 5.0
    active: true
    direction: long

  - name: UNIUSDT       # 2mo net +2.47 | liqs 5
    tp_pct: 0.5
    stop_pct: 5.0
    active: true
    direction: long

  - name: SUIUSDT       # 2mo net +2.35 | liqs 5
    tp_pct: 0.5
    stop_pct: 5.0
    active: true
    direction: long

global:
  leverage: 10                # DO NOT RAISE — see header rule 1
  base_margin: 2.0            # floor when risk sizing would go below minNotional
  dca_margin: 2.0
  risk_per_trade_pct: 0.30    # full basket = 30% of live balance (MC-validated w/ ATR ladder)
  max_dca_orders: 3
  drop_step_pct: 0.3
  step_multiplier: 1.0
  size_multiplier: 1.1
  first_order_ratio: 0.96
  max_concurrent_baskets: 3   # max 90% equity deployed
  daily_loss_limit: 15.0      # ~17% of $87 start; two ladder-wipes = day over
  # ATR-adaptive ladder: per-entry step% = clamp(0.75*ATR14/close*100, 0.2, 1.0).
  # Widens spacing in volatile tape. May-2026 OOS: liqs 21 -> 5 vs fixed 0.3%.
  # The liq reduction is what lets risk_per_trade_pct run 0.30 instead of 0.20.
  atr_ladder_mult: 0.75
  atr_step_min_pct: 0.2
  atr_step_max_pct: 1.0
  greencount_filter: true     # N=10 lookback gate — OOS-proven regime filter
  greencount_period: 10
  greencount_auto_side: true  # greens>reds -> long, reds>greens -> short
  fee_taker: 0.0005
  fee_maker: 0.0002
  poll_interval_sec: 60
  trail_activate_pct: 0.0
  trail_buffer_pct: 0.3
  ntfy_topic: "kool-bot-7x4q9"
