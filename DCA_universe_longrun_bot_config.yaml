# DCA_universe_longrun_bot_config.yaml
# 10-symbol quality universe — RR > 2.3, cushion > 59%, worst > -$0.56, no liquidation events.
# PORTALUSDT kept for volume (133 trades/mo). Dropped ESPORTS/CLO/SIREN (RR<0.6, liq risk).
# max_concurrent_baskets: 2 — 3 worst-case = $40.89 > $35 capital on full DCA fill.
# Trade live: python bot.py --config DCA_universe_longrun_bot_config.yaml
# Dry run:    python bot.py --config DCA_universe_longrun_bot_config.yaml --dry-run

api:
  key: ${BINANCE_API_KEY}
  secret: ${BINANCE_API_SECRET}

symbols:
  # Elite RR — near-zero downside per loss
  # body_pct=2.0 — RR collapses at 1.5, PnL drops
  - name: JELLYJELLYUSDT  # RR=14.25→0.58  PnL $2.19→$1.15 at 1.5
    direction: long
    tp_pct: 1.06
    stop_pct: 9999
    max_dca_orders: 4
    body_pct: 2.0
    active: true
  - name: TACUSDT          # RR=7.15→0.35  PnL $3.35→$2.79 at 1.5
    direction: long
    tp_pct: 1.06
    stop_pct: 9999
    max_dca_orders: 4
    body_pct: 2.0
    active: true
  - name: CAPUSDT          # RR=5.38→1.31  keep quality
    direction: long
    tp_pct: 1.06
    stop_pct: 9999
    max_dca_orders: 4
    body_pct: 2.0
    active: true
  # body_pct=1.5 — more trades, PnL improves
  - name: AIAUSDT         # PnL $2.74→$4.06  +$1.32
    direction: long
    tp_pct: 1.06
    stop_pct: 9999
    max_dca_orders: 4
    body_pct: 1.5
    active: true
  - name: GWEIUSDT         # PnL $4.60→$6.59  +$1.99
    direction: long
    tp_pct: 1.06
    stop_pct: 9999
    max_dca_orders: 4
    body_pct: 1.5
    active: true
  - name: OUSDT            # PnL $2.45→$5.08  +$2.63
    direction: long
    tp_pct: 1.06
    stop_pct: 9999
    max_dca_orders: 4
    body_pct: 1.5
    active: true
  - name: MYXUSDT          # PnL $5.14→$7.77  +$2.63
    direction: long
    tp_pct: 1.06
    stop_pct: 9999
    max_dca_orders: 4
    body_pct: 1.5
    active: true
  - name: OPGUSDT          # PnL $2.16→$3.11  +$0.95
    direction: long
    tp_pct: 1.06
    stop_pct: 9999
    max_dca_orders: 4
    body_pct: 1.5
    active: true
  - name: CTRUSDT          # PnL $1.70→$2.89  +$1.19
    direction: long
    tp_pct: 1.06
    stop_pct: 9999
    max_dca_orders: 4
    body_pct: 1.5
    active: true
  - name: PORTALUSDT       # PnL $10.17→$13.66  +$3.49
    direction: long
    tp_pct: 1.06
    stop_pct: 9999
    max_dca_orders: 4
    body_pct: 1.5
    active: true

global:
  leverage: 10
  base_margin: 2.5            # $/basket first order
  dca_margin: 2.5             # per safety order
  max_dca_orders: 4
  drop_step_pct: 0.68
  step_multiplier: 1.0
  size_multiplier: 1.1
  first_order_ratio: 0.96
  max_concurrent_baskets: 2   # 3 baskets worst-case = $40.89 > $35 capital
  daily_loss_limit: 3.5
  fee_taker: 0.0005
  fee_maker: 0.0002
  poll_interval_sec: 30
  risk_per_trade_pct: 0.0
  trail_activate_pct: 0.75
  trail_buffer_pct: 0.45
  ntfy_topic: kool-bot-7x4q9
